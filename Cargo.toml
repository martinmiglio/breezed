[package]
name = "breezed"
version = "0.4.2"
edition = "2024"
rust-version = "1.100"
description = "Curve-based fan controller for Dell PowerEdge servers via iDRAC/IPMI"
license = "MIT"
publish = false
repository = "https://github.com/martinmiglio/breezed"
readme = "README.md"

[features]
# Experimental: talk RMCP+ directly instead of spawning ipmitool.
native-ipmi = ["dep:ipmi-rs"]

[dependencies]
# Pinned to the fork until the session-close and privilege changes are released upstream.
ipmi-rs = { git = "https://github.com/martinmiglio/ipmi-rs", rev = "6a6ad281e5ed4cb1dda6345fb60823801fd5be5c", version = "0.6.0", default-features = false, optional = true }
jiff = "1.0.1"
clap = { version = "4.6.8", features = ["derive"] }
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
wait-timeout = "0.2.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
