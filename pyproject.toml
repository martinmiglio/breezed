[project]
name = "breezed"
version = "0.1.0"
description = "Curve-based fan controller for Dell PowerEdge servers via iDRAC/IPMI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Martin Miglio", email = "contact@martinmiglio.dev" }]
requires-python = ">=3.13"
dependencies = ["typer>=0.12"]

[project.scripts]
breezed = "breezed.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breezed"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]
