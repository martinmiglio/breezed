[project]
name = "breezed"
dynamic = ["version"]
description = "Curve-based fan controller for Dell PowerEdge servers via iDRAC/IPMI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Martin Miglio", email = "contact@martinmiglio.dev" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=13",
    "typer>=0.12",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/martinmiglio/breezed"
Repository = "https://github.com/martinmiglio/breezed"
Issues = "https://github.com/martinmiglio/breezed/issues"

[project.scripts]
breezed = "breezed.entry:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breezed"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/breezed/_version.py"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]
