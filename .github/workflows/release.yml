name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Verify the tag matches the Cargo version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "breezed") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
            exit 1
          fi

      - name: Check
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="breezed-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          cp "target/x86_64-unknown-linux-gnu/release/breezed" "dist/${name}/breezed"
          cp resources/breezed.service.template "dist/${name}/breezed.service"
          cp resources/breezed.toml.example "dist/${name}/breezed.toml.example"
          cp README.md "dist/${name}/README.md"
          cp PARITY.md "dist/${name}/PARITY.md"
          cp ../LICENSE "dist/${name}/LICENSE"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)

      - name: Attest the release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/rust/dist/*.tar.gz
            ${{ github.workspace }}/rust/dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "breezed ${GITHUB_REF_NAME}"
