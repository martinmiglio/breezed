name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify the tag matches the Cargo version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "breezed") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
            exit 1
          fi

      - name: Check
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="breezed-${version}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${name}"
          cp "target/x86_64-unknown-linux-musl/release/breezed" "dist/${name}/breezed"
          cp resources/breezed.service.template "dist/${name}/breezed.service"
          cp resources/breezed.toml.example "dist/${name}/breezed.toml.example"
          cp README.md "dist/${name}/README.md"
          cp ARCHITECTURE.md "dist/${name}/ARCHITECTURE.md"
          cp LICENSE "dist/${name}/LICENSE"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)
          sed "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"${version}\"|" install.sh > dist/install.sh
          chmod +x dist/install.sh

      - name: Smoke-test the packaged archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="breezed-${version}-x86_64-unknown-linux-musl"
          tar -xzf "dist/${name}.tar.gz" -C dist
          "./dist/${name}/breezed" --version
          "./dist/install.sh" --help >/dev/null

      - name: Attest the release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ github.workspace }}/dist/*.tar.gz
            ${{ github.workspace }}/dist/install.sh
            ${{ github.workspace }}/dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/install.sh \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "breezed ${GITHUB_REF_NAME}"
