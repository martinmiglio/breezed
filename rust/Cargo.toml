[package]
name = "breezed"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Curve-based fan controller for Dell PowerEdge servers via iDRAC/IPMI"
license = "MIT"
repository = "https://github.com/martinmiglio/breezed"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
regex = "1.13.2"
signal-hook = "0.4.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
wait-timeout = "0.2.1"

[dev-dependencies]
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
